[package]
name = "sshbridge"
version = "0.2.0"
edition = "2021"
description = "Small SSH-over-WebSocket client for ProxyCommand and local TCP forwarding"
license = "MIT"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
